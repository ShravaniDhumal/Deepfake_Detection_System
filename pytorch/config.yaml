data:
  # Use Hugging Face dataset (recommended)
  use_huggingface_dataset: true
  huggingface_dataset: "prithivMLmods/OpenDeepfake-Preview"
  train_split: "train"
  val_split: "train"  # Using train split for both, or specify validation split if available
  
  # Local data directories (fallback)
  train_dir: ../data/processed/train
  val_dir: ../data/processed/val
  image_size: 224
  batch_size: 16

training:
  epochs: 5
  learning_rate: 0.0001
  num_classes: 2

model:
  pretrained: true
  save_path: ../pytorch/xception_deepfake.pth
